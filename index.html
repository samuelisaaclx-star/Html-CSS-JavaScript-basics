<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smartphone X</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Smartphone X</h1>
    </header>

    <main>
        <img 
            src="https://m.media-amazon.com/images/I/61ho0+k1ZFL._AC_SX679_.jpg"
            width="300"
            height="300"
            alt="Samsung Galaxy S26 Ultra"
        >

        <p id="description">
            The Samsung Galaxy S26 Ultra Black 512 GB is one of Samsung's most advanced smartphones in 2026.
            It stands out for its performance, camera quality, and large storage capacity.
        </p>

        <br>

        <label for="name">Name</label><br>
        <input id="name" type="text" placeholder="Enter your name">

        <br><br>

        <label for="email">Email</label><br>
        <input id="email" type="email" placeholder="Enter your email">

        <br><br>

        <button onclick="buyProduct()">Buy</button>

        <br><br>

        <button onclick="showSpecifications()">View Specifications</button>

        <p id="message"></p>
    </main>

    <footer>
        © Sumeshang Store
    </footer>

    <script src="script.js"></script>

</body>
</html>
